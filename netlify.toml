# Netlify configuration file
[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/proxy/telegram"
  to = "/.netlify/functions/telegram-proxy"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
