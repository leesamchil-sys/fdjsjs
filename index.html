    <script>
      (function() {
        try {
          var theme = localStorage.getItem('pig_town_theme_mode');
          var isDark = theme === 'dark';
          if (!theme || theme === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0c0a09';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#fafaf9';
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background-color: #fafaf9; }
      html.dark { background-color: #0c0a09; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>피그타운 - 두근두근타운 도감 & 작물 재배 알림이</title>
    <script>
      // Suppress benign developer-environment websocket (Vite HMR) connection warnings/errors
      window.addEventListener('unhandledrejection', (event) => {
        const reason = event.reason;
        if (reason) {
          const message = typeof reason === 'string' ? reason : (reason.message || '');
          if (
            message.includes('WebSocket') || 
            message.includes('websocket') || 
            message.includes('ws://') || 
            message.includes('wss://')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }
      });
      window.addEventListener('error', (event) => {
        const message = event.message || '';
        if (
          message.includes('WebSocket') || 
          message.includes('websocket') || 
          message.includes('ws://') || 
          message.includes('wss://')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('SW Registered:', reg.scope);
            // Check for updates on every load
            reg.update();
          }).catch((err) => {
            console.error('SW Registration failed:', err);
          });
        });

        // Reload the page when a new service worker starts controlling it
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
